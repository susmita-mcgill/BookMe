<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BookMe — dine-in prototype</title>
  <meta name="description" content="BookMe: a working prototype of an in-restaurant dining app for Chicago diners and restaurant operators.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="phone" id="phone">
      <div class="phone-status">
        <span class="phone-time" id="phoneTime">7:24</span>
        <span class="phone-notch" aria-hidden="true"></span>
        <span class="phone-icons" aria-hidden="true">
          <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
          <svg width="24" height="11" viewBox="0 0 24 11"><rect x="0.5" y="0.5" width="20" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="2" y="2" width="15" height="7" rx="1.6"/><rect x="21.5" y="3.5" width="1.6" height="4" rx="0.8"/></svg>
        </span>
      </div>
      <div class="screen" id="screen" aria-live="polite"></div>
    </div>
  </main>

  <aside class="demo" id="demo">
    <button class="demo-toggle" id="demoToggle" aria-expanded="false" aria-controls="demoPanel">
      Demo
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="demo-panel" id="demoPanel" hidden>
      <div class="demo-source" id="demoSource">Connecting…</div>
      <div class="demo-seg" role="tablist" aria-label="View">
        <button data-mode="diner" class="is-on">Diner</button>
        <button data-mode="owner">Restaurant</button>
      </div>
      <label class="demo-label" for="demoDiner" id="demoDinerLabel">Diner profile</label>
      <select id="demoDiner"></select>
      <label class="demo-label" for="demoRestaurant" id="demoRestaurantLabel" hidden>Restaurant</label>
      <select id="demoRestaurant" hidden></select>
      <div class="demo-label">Jump to</div>
      <div class="demo-jumps" id="demoJumps"></div>
      <button class="demo-reset" id="demoReset">Reset demo</button>
    </div>
  </aside>

  <script src="data/snapshot.js"></script>
  <script src="data/dish_scores.js"></script>
  <script src="js/images.js"></script>
  <script src="js/data.js"></script>
  <script src="js/models.js"></script>
  <script src="js/query.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
